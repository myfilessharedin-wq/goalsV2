<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Goal Punch Cards</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" type="image/png" href="./favicon.png">
</head>

<body>

<main class="app">

  <!-- HEADER -->
  <div class="header">
    <h1 class="app-title">My Goals</h1>

    <div class="view-all-wrapper">
      <button id="viewAllBtn" class="view-all-btn">
        View all ▾
      </button>

      <div id="viewAllDropdown" class="view-all-dropdown hidden"></div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="goals-toolbar">

    <input
      type="text"
      id="searchInput"
      placeholder="Search goals..."
    />

    <div class="tabs">
      <button
        id="activeTab"
        class="tab-btn active"
        data-tab="active"
      >
        Active
      </button>

      <button
        id="completedTab"
        class="tab-btn"
        data-tab="completed"
      >
        Completed
      </button>
    </div>

  </div>

  <!-- CARDS -->
  <section class="cards-wrapper" id="cardsWrapper"></section>

  <!-- FAB -->
  <button class="fab" id="fabBtn">+</button>

  <!-- MODAL -->
  <div class="add-modal hidden" id="addModal">
    <div class="add-form">

      <button class="close-modal" id="closeModal">×</button>

      <input id="title" type="text" placeholder="Goal title" />
      <input id="target" type="number" min="1" placeholder="Target punches" />
      <input id="reward" type="text" placeholder="Reward" />
      <input id="priority" type="number" min="1" max="3" placeholder="Priority (1-3)" />

      <button id="addBtn">Add Goal</button>

    </div>
  </div>

</main>

<script type="module" src="./app.js?v=2"></script>

</body>
</html>
